name: Deploy Frontend to EC2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_FRONTEND_KEY }}
          script: |
            set -e

            echo "Connected to EC2"

            cd /home/ubuntu

            # Clone repo if not exists
            if [ ! -d "-KUREMEDI-LUCENT-Project" ]; then
              git clone https://github.com/ankurkushwaha809/-KUREMEDI-LUCENT-Project.git
            fi

            cd -- "-KUREMEDI-LUCENT-Project"

            echo "Pull latest code"
            git pull origin main

            # -------- ADMIN BUILD --------
            echo "Building admin panel..."
            cd Frontend/admin

            export VITE_BASE_URL="https://backend.kuremedi.com/api"
            export VITE_FILE_URL="https://backend.kuremedi.com"

            npm install
            npm run build

            # Check build success
            if [ ! -d "dist" ]; then
              echo "Admin build failed ❌"
              exit 1
            fi

            sudo rm -rf /var/www/admin
            sudo mkdir -p /var/www/admin
            sudo cp -r dist/* /var/www/admin/
            sudo chmod -R 755 /var/www/admin

            # -------- WEBSITE BUILD --------
            echo "Building website..."
            cd ../website

            export NEXT_PUBLIC_API_URL="https://backend.kuremedi.com/api"
            export NEXT_PUBLIC_UPLOAD_BASE="https://backend.kuremedi.com"

            npm install
            npm run build

            # Ensure correct port
            echo "Starting Next.js on port 3000"

            pm2 delete website || true
            pm2 start npm --name website -- start

            pm2 save

            # -------- NGINX RESTART --------
            echo "Restart nginx"
            sudo systemctl restart nginx

            echo "Frontend deployment successful 🚀"
