name: Deploy Frontend to EC2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.FRONTEND_USER }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          port: 22
          script_stop: true
          timeout: 30m
          command_timeout: 20m
          script: |
            set -e

            echo "===== CONNECTED TO EC2 ====="
            whoami
            pwd

            cd /home/ubuntu

            # -------- CLONE / UPDATE REPO --------
            if [ ! -d "-KUREMEDI-LUCENT-Project" ]; then
              echo "Cloning repository..."
              git clone https://github.com/ankurkushwaha809/-KUREMEDI-LUCENT-Project.git
            fi

            cd "-KUREMEDI-LUCENT-Project"

            echo "Pulling latest code..."
            git fetch --all
            git reset --hard origin/main

            # -------- ADMIN BUILD --------
            echo "===== BUILDING ADMIN ====="
            cd Frontend/admin

            npm install
            npm run build

            if [ ! -d "dist" ]; then
              echo "❌ Admin build failed"
              exit 1
            fi

            echo "Deploying admin..."
            sudo rm -rf /var/www/admin
            sudo mkdir -p /var/www/admin
            sudo cp -r dist/* /var/www/admin/
            sudo chmod -R 755 /var/www/admin

            # -------- WEBSITE BUILD --------
            echo "===== BUILDING WEBSITE ====="
            cd ../website

            export NEXT_PUBLIC_API_URL="https://backend.kuremedi.com/api"

            npm install
            npm run build

            echo "Restarting PM2..."
            pm2 delete all || true
            pm2 start npm --name website -- start
            pm2 save

            # -------- VERIFY WEBSITE --------
            sleep 5
            curl -f http://localhost:3000 || (echo "❌ Website failed to start" && exit 1)

            # -------- NGINX --------
            echo "Restarting nginx..."
            sudo nginx -t
            sudo systemctl restart nginx

            echo "===== DEPLOYMENT SUCCESSFUL 🚀 ====="
