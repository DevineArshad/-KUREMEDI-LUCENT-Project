name: Deploy Frontend to EC2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.FRONTEND_USER || 'ubuntu' }}
          key: ${{ secrets.FRONTEND_SSH_KEY || secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "CONNECTED"

            cd /home/ubuntu

            if [ ! -d "./-KUREMEDI-LUCENT-Project" ]; then
              git clone https://github.com/ankurkushwaha809/-KUREMEDI-LUCENT-Project.git
            fi

            cd -- "-KUREMEDI-LUCENT-Project"

            git fetch --all
            git reset --hard origin/main

            # -------- ADMIN --------
            cd Frontend/admin
            export VITE_APP_BASE="${{ secrets.ADMIN_BASE_PATH || '/' }}"
            npm install
            npm run build

            sudo npm install -g serve

            pm2 delete admin || true
            pm2 start serve --name admin -- -s dist -l 3008

            # -------- WEBSITE --------
            cd ../website
            export NEXT_PUBLIC_API_URL="https://backend.kuremedi.com/api"

            npm install
            npm run build

            pm2 delete website || true
            pm2 start npm --name website -- start

            pm2 save

            sudo systemctl restart nginx

            echo "DEPLOY DONE 🚀"
