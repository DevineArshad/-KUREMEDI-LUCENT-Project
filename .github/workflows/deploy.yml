name: Deploy Node Backend to EC2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.BACKEND_HOST || secrets.EC2_HOST || secrets.FRONTEND_HOST }}
      SSH_USER: ${{ secrets.BACKEND_USER || secrets.FRONTEND_USER || 'ubuntu' }}
      SSH_KEY: ${{ secrets.BACKEND_SSH_KEY || secrets.EC2_SSH_KEY || secrets.FRONTEND_SSH_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Validate SSH Secrets
        run: |
          if [ -z "${SSH_HOST}" ]; then
            echo "Missing secret: BACKEND_HOST or EC2_HOST or FRONTEND_HOST"
            exit 1
          fi
          if [ -z "${SSH_KEY}" ]; then
            echo "Missing secret: BACKEND_SSH_KEY or EC2_SSH_KEY or FRONTEND_SSH_KEY"
            exit 1
          fi
          echo "SSH secret validation passed"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            set -e

            echo "Connected to EC2"

            cd /home/ubuntu

            # Clone repo if not exists
            if [ ! -d "./-KUREMEDI-LUCENT-Project/.git" ]; then
              git clone https://github.com/ankurkushwaha809/-KUREMEDI-LUCENT-Project.git ./-KUREMEDI-LUCENT-Project
            fi

            cd -- "-KUREMEDI-LUCENT-Project/backend"

            echo "Pull latest code"
            git fetch --all
            git reset --hard origin/main

            echo "Install dependencies"
            npm install

            echo "Stop old processes"
            pm2 delete all || true

            echo "Start backend"
            pm2 start index.js --name backend

            pm2 save

            echo "Restart nginx"
            sudo systemctl restart nginx

            echo "Deployment successful 🚀"
